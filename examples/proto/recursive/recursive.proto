// recursive.proto pins the golang/go#79711 regression: messages whose
// map values close an instantiation cycle. For those, the map getter
// must spell out goconst.Map2[K, <Msg>_Const, *<Msg>] rather than the
// per-message generic alias <Msg>_ConstMap[K] — otherwise any
// *importing* package dies with "fatal error: all goroutines are
// asleep - deadlock!" inside the compiler's unified importer.
//
// The file is equally a precision test: only the fields actually on a
// cycle may lose the alias. Every other shape here (scalar-valued
// maps, repeated / singular self-references, and a map that merely
// *points at* a cycle member without being part of one) must keep
// generating exactly what it did before the workaround existed.
//
// The cross-package half of the regression lives in
// ../../regression/aliascycle — the deadlock only reproduces from a
// package that imports these types, never from this one.
syntax = "proto3";

package recursive;

// SelfMap is the direct cycle: a message holding a map of itself.
// Modelled on the real-world report (a recursive loot-table node).
// Only `children` is on the cycle.
message SelfMap {
  string id = 1;
  // On a cycle (self-edge) -> expanded goconst.Map2.
  map<int64, SelfMap> children = 2;
  // Non-message map value -> plain goconst.Map, never an alias.
  map<int64, bool> flags = 3;
  // Self-referential repeated / singular fields stay on the
  // non-generic <Msg>_ConstSlice alias / <Msg>_Const, which the
  // compiler bug does not reach.
  repeated SelfMap siblings = 4;
  SelfMap parent = 5;
}

// MutualA / MutualB close the cycle indirectly: neither message
// references itself, so a naive "is this field's type its own parent?"
// check would miss it. Both edges are on the cycle.
message MutualA {
  map<int64, MutualB> bs = 1;
}

message MutualB {
  map<int64, MutualA> as = 1;
}

// PointsAtCycle is the precision case. Its map value SelfMap *is* part
// of a cycle, but SelfMap can never reach PointsAtCycle back, so this
// edge is not on a cycle and must keep the short alias
// SelfMap_ConstMap[int64].
message PointsAtCycle {
  map<int64, SelfMap> nodes = 1;
  map<int64, MutualA> mutuals = 2;
}

// NestedSelf exercises a nested type whose two map fields differ: one
// is on a cycle, the other is not.
message NestedSelf {
  message Inner {
    // Inner -> NestedSelf, and NestedSelf holds Inner only as a
    // singular field (no map edge back), so this edge is acyclic and
    // keeps the alias.
    map<string, NestedSelf> outers = 1;
    // Self-edge -> expanded.
    map<string, Inner> inners = 2;
  }
  Inner inner = 1;
}
